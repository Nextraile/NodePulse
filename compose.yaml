services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: nodepulse-mq/app:1.0.0
    container_name: nodepulse
    user: node
    working_dir: /home/node/app

    env_file:
      - path: .env
        required: false

    environment:
      - NODE_OPTIONS=--max-old-space-size=${APP_MAX_RAM_MB:-1843}
      - UV_THREADPOOL_SIZE=${APP_THREADS:-4}

    ports:
      - "${HOST_HTTP_PORT:-3000}:3000"
      - "${HOST_TCP_PORT:-4000}:4000"
      - "${HOST_DEBUGGER_PORT:-9229}:9229"

    networks:
      - mq_network

    deploy:
      resources:
        limits:
          cpus: "${DOCKER_CPUS_LIMIT:-1.00}"
          memory: ${DOCKER_MEMORY_LIMIT_MB:-2048}m
        reservations:
          cpus: "${DOCKER_CPUS_RESERVATION:-0.25}"
          memory: ${DOCKER_MEMORY_RESERVATION_MB:-128}m
          
networks:
  mq_network:
    driver: bridge
