services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: nodepulse-mq/app:dev
    container_name: nodepulse.dev
    user: node
    working_dir: /home/node/app

    environment:
      - NODE_OPTIONS=--max-old-space-size=${APP_MAX_RAM_MB:-1843}
      - UV_THREADPOOL_SIZE=${APP_THREADS:-4}

    ports:
      - "${HOST_HTTP_PORT:-3000}:3000"
      - "${HOST_TCP_PORT:-4000}:4000"
      - "${HOST_DEBUGGER_PORT:-9229}:9229"

    command: >
      sh -c "
      if [ ! -f .env ]; then
        echo '.env is not found, copying from .env.example...';
        cp .env.example .env;
      fi && npm run dev
      "

    volumes:
      - .:/home/node/app
      - /home/node/app/node_modules
      - .env:/home/node/app/.env:ro

    develop:
      watch:
        - action: sync
          path: ./src
          target: /home/node/app/src
        - action: sync
          path: ./tests
          target: /home/node/app/tests

        - action: restart
          path: .env
          target: /home/node/app/.env

        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
        - action: rebuild
          path: tsconfig.json
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: compose.dev.yaml

    networks:
      - mq_network

    deploy:
      resources:
        limits:
          cpus: "${DOCKER_CPUS_LIMIT:-1.00}"
          memory: ${DOCKER_MEMORY_LIMIT_MB:-2048}m
        reservations:
          cpus: "${DOCKER_CPUS_RESERVATION:-0.25}"
          memory: ${DOCKER_MEMORY_RESERVATION_MB:-128}m
          
networks:
  mq_network:
    driver: bridge
